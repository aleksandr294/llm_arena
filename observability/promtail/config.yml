# Reads the api and worker containers' JSON stdout (Docker's own
# "json-file" logging driver, the Compose default) and ships it to Loki.
# Every other container (postgres, rabbitmq, this stack itself) is left
# alone: only the app's own services produce the structured JSON logs
# this project cares about.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: compose
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [service]
        regex: "api|worker"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # Unwraps the Docker JSON log envelope; the app's own JSON line
      # becomes the log line stored in Loki, unmodified.
      - docker: {}
