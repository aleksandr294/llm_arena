# Local hooks reuse the Poetry-pinned tool versions.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: poetry run ruff check --fix
        language: system
        types: [python]
        # Explicit file arguments bypass ruff's extend-exclude, so keep the
        # generated-style migrations out of the autofix here too.
        exclude: ^migrations/versions/
      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-security
        name: ruff security rules (S) on production code
        entry: poetry run ruff check --select S
        language: system
        types: [python]
        exclude: ^(tests/|conftest\.py$)
