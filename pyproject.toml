[tool.poetry]
name = "llm-arena"
version = "0.1.0"
description = "LLM Arena for Developers: backend for evaluating and comparing LLMs"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.121.1"
pydantic = "^2"
pydantic-settings = "*"
sqlalchemy = {version = "^2", extras = ["asyncio"]}
asyncpg = "*"
alembic = "*"
taskiq = "*"
taskiq-aio-pika = "*"
uvicorn = "*"
openai = "^3.32.0"
anthropic = "^1.15.0"
pyjwt = "^2.15.1"
argon2-cffi = "^25.1.0"
typer = "^0.27.3"
fastadmin = {version = "~0.10", extras = ["fastapi", "sqlalchemy"]}

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
httpx = "*"
ruff = "*"
black = "*"
mypy = "*"
pre-commit = "*"
bandit = "^1.9.4"
pip-audit = "^2.10.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80
target-version = ["py312"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "PT", "RUF"]
# PT018 (split composite assertions) is style-only and would rewrite ~100
# deliberate multi-condition asserts in tests.
ignore = ["PT018"]

[tool.ruff.lint.per-file-ignores]
# The async context manager under test is the subject of these raises blocks.
"tests/core/test_session_scope.py" = ["PT012"]
# Non-ASCII Cyrillic text is the test input (Unicode preservation).
"tests/datasets/test_api.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["admin", "api", "components", "tests"]
explicit_package_bases = true

# fastadmin ships no type information.
[[tool.mypy.overrides]]
module = ["fastadmin", "fastadmin.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".mypy_cache", ".ruff_cache", ".pytest_cache"]
# Targets and the severity threshold (-ll) are given on the command line.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs running PostgreSQL/RabbitMQ",
    "real_provider: calls real LLM provider APIs (opt-in, costs money)",
]
